<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shotbird · Sign in</title>
<link rel="icon" href="/board/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Shotbird's sign-in for teammates on the office network. Same tokens as the board. */
:root{--bg:#f6f6f7;--surface:#fff;--surface-2:#f1f1f3;--line:#e6e6e9;--line-2:#d8d8dd;--text:#0c0c0e;--muted:#6b6b74;--faint:#a1a1a9;
  --accent:#ff5b22;--accent-ink:#fff;--accent-soft:rgba(255,91,34,.09);--accent-line:rgba(255,91,34,.4);--bad:#e5484d;--bad-soft:rgba(229,72,77,.1);
  --shadow:0 1px 2px rgba(16,16,20,.04),0 10px 28px -12px rgba(16,16,20,.16);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:rgba(16,16,18,.92);--surface-2:rgba(255,255,255,.055);--line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.14);--text:#f4f4f5;--muted:#a1a1aa;--faint:#62626b;--accent:#ff6b3d;--accent-ink:#160904;--accent-soft:rgba(255,107,61,.12);
  --accent-line:rgba(255,107,61,.45);--bad:#ff6369;--bad-soft:rgba(255,99,105,.12);--shadow:0 30px 80px -20px rgba(0,0,0,.75);color-scheme:dark}
  body{background:radial-gradient(60% 50% at 20% 0%,rgba(255,107,61,.18),transparent 70%),radial-gradient(50% 45% at 90% 100%,rgba(255,64,24,.14),transparent 70%),#000}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Geist",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 24px 24px}
.mark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;color:#160904;
  background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.3),transparent 55%),linear-gradient(180deg,#ff8657,#ff4f1a);box-shadow:0 14px 40px -12px rgba(255,91,34,.6)}
.mark svg{width:28px;height:28px}
h1{font:600 26px/1.1 "Funnel Display","Geist",sans-serif;letter-spacing:-.035em;margin:0 0 6px;text-align:center}
p.sub{margin:0 0 22px;color:var(--muted);text-align:center;font-size:13.5px}
label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 6px}
input{width:100%;height:42px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);color:var(--text);font:15px "Geist",sans-serif;padding:0 13px;outline:0;margin:0 0 14px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
button{width:100%;height:44px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 14.5px "Geist",sans-serif;cursor:pointer;margin-top:4px}
button:disabled{opacity:.55;cursor:default}
.err{display:none;background:var(--bad-soft);color:var(--text);border-radius:11px;padding:9px 12px;font-size:13px;margin:0 0 14px}
.err.on{display:block}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3"/><path d="M14 17.75V21"/><path d="M7 18a6 6 0 0 0 3.84-10.61"/></svg></div>
  <h1>Shotbird</h1>
  <p class="sub">Sign in to the team's pre-production crew.</p>
  <div class="err" id="err" role="alert"></div>
  <label for="name">Your name</label>
  <input id="name" name="name" autocomplete="name" maxlength="40" required placeholder="So the chat shows who's asking">
  <label for="pw">Team password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div class="foot">Ask the person who runs Shotbird for the password.</div>
</form>
<script>
const $=s=>document.querySelector(s), f=$('#f'), err=$('#err');
try{ const n=localStorage.getItem('sb-name'); if(n) $('#name').value=n; }catch(e){}
($('#name').value?$('#pw'):$('#name')).focus();
const next=(()=>{ const n=new URLSearchParams(location.search).get('next')||'/'; return /^\/(?!\/)/.test(n)?n:'/'; })();
f.addEventListener('submit', async e=>{
  e.preventDefault(); err.classList.remove('on'); $('#go').disabled=true; $('#go').textContent='Signing in…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,password:$('#pw').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'Could not sign in.');
    try{ localStorage.setItem('sb-name', $('#name').value.trim()); }catch(e){}
    location.replace(next);
  }catch(x){ err.textContent=x.message; err.classList.add('on'); $('#pw').value=''; $('#pw').focus(); $('#go').disabled=false; $('#go').textContent='Sign in'; }
});
</script>
</body>
</html>
