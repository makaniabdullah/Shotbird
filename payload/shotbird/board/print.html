<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Print layout for the film bible: headless Chrome prints this page to 05-lore/film-bible.pdf */
@page{size:A4;margin:18mm 16mm 20mm;
  @bottom-left{content:var(--foot,"");font:8pt "Geist",sans-serif;color:#8a8a92}
  @bottom-right{content:counter(page);font:8pt "Geist Mono",monospace;color:#8a8a92}}
@page:first{margin:0;@bottom-left{content:none}@bottom-right{content:none}}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#1a1a1e;font:10.5pt/1.62 "Geist",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover{height:297mm;width:210mm;position:relative;overflow:hidden;background:#000;color:#fff;break-after:page;display:flex;flex-direction:column;justify-content:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.88))}
.cover .in{position:relative;z-index:1;padding:0 18mm 22mm}
.cover .k{font:500 9pt "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#ff6b3d}
.cover h1{font:600 40pt/1.02 "Funnel Display",sans-serif;letter-spacing:-.035em;margin:6mm 0 4mm}
.cover .m{font-size:11pt;color:rgba(255,255,255,.78)}
.cover .brand{position:absolute;top:16mm;left:18mm;z-index:1;display:flex;align-items:center;gap:8px;font:600 13pt "Funnel Display",sans-serif;letter-spacing:-.02em}
.cover .brand i{width:22px;height:22px;border-radius:6px;background:#ff6b3d;display:inline-block}
.toc{break-after:page}
.toc h2{font:600 18pt "Funnel Display",sans-serif;letter-spacing:-.02em;margin:0 0 8mm}
.toc ol{margin:0;padding:0;list-style:none;counter-reset:t}
.toc li{counter-increment:t;display:flex;gap:10px;padding:2.4mm 0;border-bottom:.5pt solid #e6e6ea;font-size:11pt}
.toc li::before{content:counter(t,decimal-leading-zero);font:500 9pt "Geist Mono",monospace;color:#ff5b22;padding-top:1.5pt;width:18px}
.md h1{font:600 24pt/1.1 "Funnel Display",sans-serif;letter-spacing:-.03em;margin:0 0 6mm}
.md h2{font:600 15pt/1.25 "Funnel Display",sans-serif;letter-spacing:-.02em;margin:10mm 0 3mm;padding-top:4mm;border-top:1.2pt solid #ff6b3d;break-after:avoid}
.md h3{font-weight:600;font-size:11pt;margin:6mm 0 2mm;break-after:avoid}
.md p{margin:0 0 3mm;orphans:3;widows:3}
.md ul,.md ol{margin:0 0 3mm;padding-left:5mm}
.md li{margin:.8mm 0}
.md img{max-width:100%;border-radius:2mm;break-inside:avoid;display:block;margin:3mm 0}
.md table{border-collapse:collapse;width:100%;font-size:8.6pt;margin:3mm 0;break-inside:auto}
.md tr{break-inside:avoid}
.md th,.md td{border-bottom:.5pt solid #e2e2e6;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.md th{font-weight:600;color:#5a5a62;background:#f6f6f7}
.md blockquote{margin:3mm 0;padding:1mm 0 1mm 4mm;border-left:1.5pt solid #ff6b3d;color:#38383e}
.md code{font:8.8pt "Geist Mono",monospace;background:#f2f2f4;padding:.3mm 1mm;border-radius:1mm}
.md pre{background:#f6f6f7;border-radius:2mm;padding:3mm;white-space:pre-wrap;font:8.6pt/1.5 "Geist Mono",monospace;break-inside:avoid}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:.5pt solid #e2e2e6;margin:6mm 0}
.md a{color:#1a1a1e;text-decoration:none}
.md strong{font-weight:600}
</style>
</head>
<body>
<div id="out"></div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('p');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const src = (p, w) => `/p/${slug}/${String(p).split('/').map(encodeURIComponent).join('/')}${w ? `?w=${w}` : ''}`;
  const S = await (await fetch(`/p/${slug}/state.json`)).json();
  const P = S.project || {}, B = S.bible || {};
  const md = await (await fetch(src(B.path))).text();
  const box = document.createElement('div');
  box.innerHTML = DOMPurify.sanitize(marked.parse(md));
  box.querySelectorAll('img').forEach(im => { const s = im.getAttribute('src') || ''; if (s && !/^(https?:|data:|\/)/.test(s)) im.src = src(s.replace(/^(\.\.?\/)+/, ''), 1400); });
  const h1 = box.querySelector('h1'), title = (h1 ? h1.textContent : (P.title || '')).replace(/\s*[—–:-]\s*film bible\s*$/i, '') || 'Untitled';
  const sections = [...box.querySelectorAll('h2')].map(h => h.textContent);
  const first = (S.shots || []).map(sh => (sh.versions || []).slice(-1)[0]).find(v => v && v.image);
  const date = new Date().toLocaleDateString(undefined, {day: 'numeric', month: 'long', year: 'numeric'});
  document.documentElement.style.setProperty('--foot', JSON.stringify(`${title} · Film bible`));
  document.title = `${title} — Film bible`;
  document.getElementById('out').innerHTML = `
    <section class="cover">${first ? `<img src="${src(first.image, 2000)}" alt="">` : ''}
      <div class="brand"><i></i>Shotbird</div>
      <div class="in"><div class="k">Film bible</div><h1>${esc(title)}</h1>
        <div class="m">${esc(P.client || '')}${P.client ? ' · ' : ''}${esc(P.aspect || '')} · ${(S.shots || []).length} shots · ${esc(date)}</div></div></section>
    ${sections.length ? `<section class="toc"><h2>Contents</h2><ol>${sections.map(t => `<li>${esc(t)}</li>`).join('')}</ol></section>` : ''}
    <article class="md">${box.innerHTML}</article>`;
  window.__ready = true;
})();
</script>
</body>
</html>
