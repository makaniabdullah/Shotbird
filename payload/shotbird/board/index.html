      <div class="row"><button class="ibtn" data-act="attach" title="Attach a brief, PDF, reference video or image" aria-label="Attach files">${ic('paperclip')}</button><button class="chipbtn" data-act="models" id="modelchip"></button>
        <select class="sel" id="aspect" title="Aspect ratio" aria-label="Aspect ratio">${['16:9','9:16','1:1','4:5','21:9'].map(a=>`<option ${a===homeOpts.aspect?'selected':''}>${a}</option>`).join('')}</select>
        <div class="seg"><button class="${auto?'':'on'}" data-act="mode" data-mode="ask" title="Ask before spending credits">${ic('shield-check')}Always ask</button><button class="${auto?'on auto':''}" data-act="mode" data-mode="autopilot" title="Go ahead within the approved credit cap">${ic('zap')}Autopilot</button></div>
        <button class="send" id="sendbtn" data-act="start" aria-label="Start project" disabled>${ic('arrow-up')}</button></div></div>
      <div class="pop" id="pop"></div></div>
    <div class="starters sugg">${STARTERS.map(([l,t])=>`<button data-act="fill" data-text="${esc(t)}">${ic('sparkles')}${esc(l)}</button>`).join('')}</div>
    <div class="crewrow">${ORDER.map(k=>`<button style="--c:${AG[k].c}" data-act="drawer" data-k="crew" title="${AG[k].role}"><span class="ic">${ic(AG[k].icon)}</span>${cap(k)}</button>`).join('')}</div></section>
    <section class="recent" id="recent"></section>`;
  $('#modelchip').innerHTML=modelChip();
  $('#aspect').onchange=e=>{ homeOpts.aspect=e.target.value; };
  wireComposer($('#chatin'), startProject); wireDrop($('#homecomposer')); reveal($('#app'), true); heroBird();
  setTimeout(()=>$('#chatin').focus(),50);
  authBanner($('#homeauth')); homeRefresh(); setInterval(homeRefresh,5000);
}
// The logo bird in flight: same head, beak and back as the Lucide bird, legs tucked, two wings that beat from the shoulder
const BIRD_FLY = `<span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <g class="wing far"><path d="M11 9.5C9.2 4.6 5.2 1.6.5 1.8c2.4 3.2 5 6 8.6 8.6"/></g>
  <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M16 7h.01"/>
  <g class="wing"><path d="M11 9.5C9.2 4.6 5.2 1.6.5 1.8c2.4 3.2 5 6 8.6 8.6"/></g></svg></span>`;
function heroBird(){
  const mark=$('#heromark'); if(!mark) return;
  let state='home', busy=false;
  const ease='cubic-bezier(.45,0,.25,1)';
  function feathers(x, y){
    for(let i=0;i<7;i++){
      const f=document.createElement('i'), s=2+Math.round(Math.random()*2);
      f.className='feather'; f.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;--fx:${(Math.random()*70-35).toFixed(0)}px;--fy:${(Math.random()*50+10).toFixed(0)}px;animation-delay:${(i*30)}ms`;
      document.body.appendChild(f); setTimeout(()=>f.remove(), 1500);
    }
  }
  function flight(out){
    const b=mark.querySelector('.bird').getBoundingClientRect();
    const dx=innerWidth-b.left+60, dy=-(b.top+140);  // off past the top-right corner
    const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#ff6b3d';
    const fly=document.createElement('div'); fly.className='bird-fly'; fly.innerHTML=BIRD_FLY;
    fly.style.cssText=`left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px`;
    document.body.appendChild(fly);
    const path=[
      {transform:'translate(0,0) rotate(0) scale(1)', color:'#160904', opacity:1},
      {transform:'translate(6px,-20px) rotate(-8deg) scale(1.08)', color:acc, opacity:1, offset:.14},
      {transform:`translate(${dx*.32}px,${dy*.22}px) rotate(-14deg) scale(.95)`, opacity:1, offset:.45},
      {transform:`translate(${dx*.7}px,${dy*.62}px) rotate(-20deg) scale(.8)`, opacity:1, offset:.78},
      {transform:`translate(${dx}px,${dy}px) rotate(-24deg) scale(.6)`, color:acc, opacity:0},
    ];
    const back=path.slice().reverse().map(k=>k.offset==null?k:{...k, offset:1-k.offset});  // homecoming: same path, backwards
    const anim=fly.animate(out?path:back, {duration:out?1700:1400, easing:ease, fill:'forwards'});
    if(out){ mark.classList.add('away'); feathers(b.left+b.width/2, b.top+b.height/2); }
    return anim.finished.then(()=>fly.remove());
  }
  async function sync(){
    if(busy) return;
    const want = scrollY>40 ? 'away' : scrollY<8 ? 'home' : state;
    if(want===state) return;
    busy=true;
    if(want==='away'){ await flight(true); }
    else { await flight(false); mark.classList.remove('away'); mark.classList.add('landed'); setTimeout(()=>mark.classList.remove('landed'), 500); }
    state=want; busy=false; sync();  // the page may have moved again during the flight
  }
  addEventListener('scroll', sync, {passive:true});
}
async function startProject(){
  const ta=$('#chatin'), text=ta.value.trim(); if(!text && !ATT.length) return; $('#sendbtn').disabled=true;
  try{
    const withFiles=ATT.length>0;
    const r=await post('/api/new',{text, models:homeOpts.models, mode:homeOpts.mode, aspect:homeOpts.aspect, start:!withFiles}); if(!r.slug) throw 0;
    if(withFiles){  // the project exists now: upload the attachments, then send the brief with them
      ATT.forEach(a=>a.status='uploading'); drawAtts();
      for(const a of ATT) await upload(a, r.slug);
      const files=ATT.filter(a=>a.status==='done').map(a=>a.info);
      await post(`/api/p/${r.slug}/chat`,{text: text || 'New brief: see the attached files.', files});
    }
    location.href='/?p='+encodeURIComponent(r.slug)+'#brief';
  }catch(e){ toast('Could not start the project','triangle-alert'); syncSend(); }
}

/* ---------- one click handler for everything ---------- */
document.addEventListener('click', async e=>{
  const pop=$('#pop'); if(pop&&pop.classList.contains('on')&&!e.target.closest('#pop')&&!e.target.closest('[data-act="models"]')) togglePop(false);
  if(e.target.id==='sheet') return closeSheet();
  const a=e.target.closest('[data-act]'); if(!a) return;
  const d=a.dataset;
  switch(d.act){
    case 'tab': tab=d.k; history.replaceState(null,'','#'+tab); $('#app').scrollTo({top:0, behavior:'instant'}); view(true); break;
    case 'shot': openSheet({type:'shot', id:d.id}); break;
    case 'prev': stepShot(-1); break;
    case 'next': stepShot(1); break;
    case 'cast': openSheet({type:'cast', id:d.id}); break;
    case 'img': openSheet({type:'img', src:d.src}); break;
    case 'close': closeSheet(); break;
    case 'view': VIEW[d.k+':'+d.id] = d.k==='s' ? +d.val : d.val; view(); if(SHEET&&SHEET.id===d.id) drawSheet(); break;
    case 'gapprove': genApprove(genOf(d)); break;
    case 'gdis': genDisapprove(genOf(d)); break;
    case 'gchg': genChanges(genOf(d)); break;
    case 'gedit': openEditor(genOf(d)); break;
    case 'copy': copyText(S.prompts[+d.i].prompt||'', `${S.prompts[+d.i].shot} prompt copied`); break;
    case 'copyall': copyText((S.prompts||[]).map(p=>`${p.shot} — ${p.model||''}\n${p.duration||''}\n\n${p.prompt||''}`).join('\n\n———\n\n'), 'All prompts copied'); break;
    case 'expand': EXPANDED.has(+d.i)?EXPANDED.delete(+d.i):EXPANDED.add(+d.i); view(); break;
    case 'hex': copyText(d.hex, `${d.hex} copied`); break;
    case 'attach': $('#filein').click(); break;
    case 'unattach': ATT=ATT.filter(x=>x.id!==+d.id); drawAtts(); break;
    case 'res': if(!a.disabled) setModel('resolution', d.res); break;
    case 'openfile': openFile(d.path); break;
    case 'exportpdf': { a.disabled=true; a.innerHTML=ic('loader-circle')+'Exporting…'; toast('Exporting the film bible as PDF…','printer');
      try{ const r=await post(`/api/p/${SLUG}/export`,{doc:'bible'}); toast('PDF ready','file-down'); openFile(r.pdf); stateSig=''; poll(); }
      catch(err){ toast('PDF export failed — is Google Chrome installed?','triangle-alert'); a.disabled=false; view(); } break; }
    case 'toc': { const t=document.getElementById(d.id); if(t) t.scrollIntoView({behavior:'smooth'}); break; }
    case 'say': if(SLUG){ if(window.innerWidth<1024) toggleChat(true); sendChat(d.text); } break;
    case 'fillchat': { const ta=$('#chatin'); ta.value=d.text; ta.dispatchEvent(new Event('input')); ta.focus(); break; }
    case 'fill': { const ta=$('#chatin'); ta.value=d.text; ta.dispatchEvent(new Event('input')); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); break; }
    case 'send': sendChat(); break;
    case 'start': startProject(); break;
    case 'stop': await post(`/api/p/${SLUG}/stop`); chatPoll(); break;
    case 'models': togglePop(); break;
    case 'mode': setMode(d.mode); break;
    case 'theme': cycleTheme(); break;
    case 'drawer': openDrawer(d.k); break;
    case 'drawer-close': closeDrawer(); break;
    case 'skill': { const c=CREW.find(x=>x.id===d.id); if(c&&c.card) openSheet({type:'doc', title:`${cap(d.id)} · skill card`, html:md(c.card)}); break; }
    case 'chat': toggleChat(d.open==='1'); break;
    case 'copycmd': copyText('sh ~/.claude/skills/shotbird/login.sh', 'Command copied'); break;
  }
});
document.addEventListener('change', e=>{ const s=e.target.closest('select[data-model]'); if(s) setModel(s.dataset.model, s.value); });
document.addEventListener('keydown', e=>{
  if(ED) return edKey(e);
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(e.key==='Escape'){ if($('#dlg').classList.contains('on')) return; if($('#pop')&&$('#pop').classList.contains('on')) return togglePop(false);
    if(SHEET) return closeSheet(); if(DRAWER) return closeDrawer(); if(chatOpen) return toggleChat(false); }
  if(SHEET&&SHEET.type==='shot'&&!typing){ if(e.key==='ArrowLeft') stepShot(-1); if(e.key==='ArrowRight') stepShot(1); }
  if(e.key==='Enter'&&!typing){ const a=document.activeElement; if(a&&a.matches('[role="button"][data-act]')){ e.preventDefault(); a.click(); } }
  if(e.key==='/'&&!typing&&!SHEET){ e.preventDefault(); if(SLUG&&window.innerWidth<1024) toggleChat(true); const ta=$('#chatin'); if(ta) ta.focus(); }
});

/* ---------- dark-mode aura: Shotbird-orange light drifting over black, plus tiny pixels that dissolve in and out ----------
   The light is drawn on a canvas at 1/6 size and scaled up (smooth and nearly free); pixels use pre-rendered glow sprites. */
(function aura(){
  const gl=document.getElementById('glow'), cv=document.getElementById('px'); if(!gl || !cv) return;
  const g=gl.getContext('2d'), cx=cv.getContext('2d'), G=22, rnd=(a,b)=>a+Math.random()*(b-a);
  const ease=k=>.5-.5*Math.cos(Math.PI*k);  // sine in-out: no hard edge at either end of a fade
  const BLOBS=[  // centre (0–1), drift amplitude, angular speeds (rad/ms), radius as a share of the long edge
    {c:'255,107,61', a:.5,  x:.12, y:.02, ax:.34, ay:.24, sx:.00026, sy:.00021, r:.62, ph:0},
    {c:'255,64,24',  a:.44, x:.9,  y:.98, ax:.38, ay:.3,  sx:.00021, sy:.00029, r:.56, ph:2.1},
    {c:'255,156,84', a:.26, x:.52, y:.5,  ax:.32, ay:.26, sx:.00031, sy:.00024, r:.42, ph:4.2},
    {c:'255,92,40',  a:.32, x:.78, y:.1,  ax:.36, ay:.32, sx:.00024, sy:.00018, r:.38, ph:1.3},
  ];
  let W=0, H=0, dpr=1, P=[], raf=0, SPR={};
  function sprite(c, s){  // one square with its glow, rendered once per colour and size
    const key=c+s; if(SPR[key]) return SPR[key];
    const pad=12, o=document.createElement('canvas'), x=o.getContext('2d');
    o.width=o.height=Math.ceil((s+pad*2)*dpr); x.scale(dpr,dpr);
    x.shadowBlur=c==='255,107,61'?9:5; x.shadowColor=`rgba(${c},.9)`; x.fillStyle=`rgb(${c})`; x.fillRect(pad,pad,s,s);
    return SPR[key]={img:o, w:s+pad*2};
  }
  function spawn(p, t){
    const r=Math.random();
    p.x=(Math.floor(Math.random()*W/G)+.5)*G; p.y=(Math.floor(Math.random()*H/G)+.5)*G; p.s=r<.12?4:r<.75?3:2;
    p.c=Math.random()<.34?'255,107,61':'255,236,226'; p.a=rnd(.42,.92);
    p.t0=t+rnd(0,3500); p.fi=rnd(1400,2600); p.h=rnd(800,3000); p.fo=rnd(1800,3400);
    p.v=Math.random()<.26?rnd(7,15):0;  // drifters rise this many px per second
    p.ph=Math.random()*6.28; return p;
  }
  function size(){
    dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; SPR={};
    gl.width=Math.max(1,Math.ceil(W/6)); gl.height=Math.max(1,Math.ceil(H/6));
    cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(96,Math.max(34,W*H/26000))), t=performance.now();
    P=Array.from({length:n},()=>{ const p=spawn({},t); p.t0=t-rnd(0,p.fi+p.h+p.fo); return p; });  // start mid-life: never an empty sky
  }
  function light(t){
    const w=gl.width, h=gl.height, L=Math.max(w,h);
    g.globalCompositeOperation='source-over'; g.clearRect(0,0,w,h); g.globalCompositeOperation='lighter';
    for(const b of BLOBS){
      const x=(b.x+b.ax*Math.sin(t*b.sx+b.ph))*w, y=(b.y+b.ay*Math.cos(t*b.sy+b.ph*1.3))*h, R=b.r*L*(1+.14*Math.sin(t*.00035+b.ph));
      const gr=g.createRadialGradient(x,y,0,x,y,R);
      gr.addColorStop(0,`rgba(${b.c},${b.a})`); gr.addColorStop(.42,`rgba(${b.c},${b.a*.32})`); gr.addColorStop(.72,`rgba(${b.c},0)`);
      g.fillStyle=gr; g.fillRect(0,0,w,h);
    }
  }
  function pixels(t){
    cx.clearRect(0,0,W,H);
    for(const p of P){
      const e=t-p.t0; if(e<0) continue;
      if(e>p.fi+p.h+p.fo){ spawn(p,t); continue; }
      const k=e<p.fi ? ease(e/p.fi) : e<p.fi+p.h ? 1 : ease(1-(e-p.fi-p.h)/p.fo);
      const a=Math.min(1, p.a*k*(1+.12*Math.sin(t/420+p.ph)));  // faint shimmer while lit
      const sp=sprite(p.c,p.s), sc=.55+.45*k, d=sp.w*sc, y=p.y-p.v*e/1000;  // dissolve: shrinks softly as it fades
      cx.globalAlpha=a; cx.drawImage(sp.img, p.x-d/2, y-d/2, d, d);
      if(p.v){  // a short trail that fades out below a drifter
        const tr=cx.createLinearGradient(0,y,0,y+18); tr.addColorStop(0,`rgba(${p.c},.45)`); tr.addColorStop(1,`rgba(${p.c},0)`);
        cx.fillStyle=tr; cx.fillRect(p.x-p.s*sc/4, y+p.s*sc/2, p.s*sc/2, 18);
      }
    }
    cx.globalAlpha=1;
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(W!==innerWidth || H!==innerHeight) size();  // also covers a window that opened at zero size
    light(t); pixels(t);
  }
  function run(){
    const on=document.documentElement.dataset.mode==='dark' && !document.hidden;
    if(on && !raf) raf=requestAnimationFrame(frame);
    if(!on && raf){ cancelAnimationFrame(raf); raf=0; }
  }
  size(); addEventListener('resize', size); document.addEventListener('visibilitychange', run);
  new MutationObserver(run).observe(document.documentElement, {attributes:true, attributeFilter:['data-mode']}); run();
})();

/* ---------- smooth wheel scrolling: the page glides to where the wheel sends it ----------
   In a project the page is the results pane (#app); the chat beside it scrolls on its own, natively. */
(function smoothWheel(){
  let target=pageY(), cur=target, raf=0, padUntil=0;
  const setY=y=>{ const s=pageEl(); if(s) s.scrollTop=y; else window.scrollTo(0,y); };
  const maxY=()=>{ const s=pageEl(); return s ? s.scrollHeight-s.clientHeight : document.documentElement.scrollHeight-innerHeight; };
  const inner=(el,dy)=>{  // a nested panel (sheet, drawer, code block…) that can still scroll this way keeps the wheel
    for(const stop=pageEl(); el && el!==document.body && el!==document.documentElement && el!==stop; el=el.parentElement){
      if(el.scrollHeight>el.clientHeight+1 && /(auto|scroll)/.test(getComputedStyle(el).overflowY))
        if(dy<0 ? el.scrollTop>0 : el.scrollTop+el.clientHeight<el.scrollHeight-1) return true;
    }
    return false;
  };
  function step(){
    cur+=(target-cur)*.2; if(Math.abs(target-cur)<.5) cur=target;
    setY(cur); raf=cur!==target ? requestAnimationFrame(step) : 0;
  }
  addEventListener('wheel', e=>{
    // A trackpad sends small, fractional or sideways steps (and momentum): leave it to macOS, which is direct.
    const now=performance.now();
    if(Math.abs(e.deltaY)<40 || !Number.isInteger(e.deltaY) || Math.abs(e.deltaX)>0) padUntil=now+450;
    if(now<padUntil){ if(raf){ cancelAnimationFrame(raf); raf=0; } return; }
    const s=pageEl(); if(s && !s.contains(e.target)) return;  // the chat column scrolls natively
    if(e.ctrlKey || e.defaultPrevented || document.body.classList.contains('lock') || inner(e.target,e.deltaY)) return;
    e.preventDefault();
    if(!raf) cur=target=pageY();
    target=Math.max(0, Math.min(maxY(), target+e.deltaY*(e.deltaMode===1?32:e.deltaMode===2?innerHeight:1)));
    if(!raf) raf=requestAnimationFrame(step);
  }, {passive:false});
  const sync=()=>{ if(!raf) cur=target=pageY(); };  // keyboard, scrollbar, anchors
  addEventListener('scroll', sync, {passive:true});
  if(pageEl()) pageEl().addEventListener('scroll', sync, {passive:true});
})();

else homeInit();
